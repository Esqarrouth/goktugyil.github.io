<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top justify-content-between" aria-label="Primary navigation">
    <a class="navbar-brand font-weight-bold" href="{{ site.baseurl }}{% link _pages/index.md %}">{{site.name}}</a>
    <button class="navbar-toggler collapsed" type="button" data-toggle="collapse" data-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon" aria-hidden="true"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav ml-auto">
        {% for item in site.data.nav %}
            {% assign item_path = '/' | append: item.href %}
            <li class="nav-item">
                <a href='{% if item.href contains ":" %}{% else %}{{ site.baseurl }}/{% endif %}{{ item.href }}'
                   class="nav-link"{% if page.url == item_path %} aria-current="page"{% endif %}>
                    {{ item.title }}
                </a>
            </li>
        {% endfor %}
        </ul>
    </div>
</nav>
