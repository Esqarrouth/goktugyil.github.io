# Outputting
permalink: /:categories/:year/:month/:day/:title.html

# Conversion
markdown:         kramdown
highlighter:      rouge
excerpt_separator: <!--more-->

# Config for your profile.
title:            Goku Yilmaz  # Site title
name:             Goku Yilmaz              # Your name
avatar:           /theme/img/avatar.jpg   # Path to an avatar image
url:              https://goktug.io
description:      Personal website of Goku Yilmaz, an engineer, entrepreneur, gamer, and biohacker.

# The theme uses the baseurl throughout, which is useful for running the entire
# site under a subdir, like for this GitHub Pages deployment as a project site.
baseurl: ""

# Add a directory to hold misc pages, just to keep the root directory clean.
include: ["_pages"]
exclude: ["AGENTS.md", "plan"]

plugins:
  - jekyll-sitemap

# Turn the projects into a collection.
collections:
  projects:
    output: true
    title: Projects
    permalink: /:collection/:name.html
  portfolio:
    output: true
    title: portfolio
    permalink: /:collection/:name.html

defaults:
# Turn the profile sidebar on for all pages by default, except for the
# collections, where it is off and replaced by useful things on the sidebar.
# To override this one a page, use
#    show_profile: false
# to hide the profile.
  -
    scope:
      path: ""
    values:
      show_profile: true
  -
    scope:
      path: "_posts"
    values:
      show_profile: false
      layout: defaults/post
  -
    scope:
      path: "_portfolio"
    values:
      show_profile: false
      layout: defaults/portfolio
      sitemap: false
  -
    scope:
      path: "_projects"
    values:
      show_profile: false
      layout: defaults/project
      sitemap: false
  # Keep theme demo and test sources buildable and findable in the repository,
  # but do not advertise them to search engines.
  -
    scope:
      path: "theme/test"
    values:
      sitemap: false
  -
    scope:
      path: "list/portfolio.html"
    values:
      sitemap: false
  -
    scope:
      path: "list/projects.md"
    values:
      sitemap: false
  -
    scope:
      path: "list"
    values:
      show_profile: false
      layout: defaults/list
