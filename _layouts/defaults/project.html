---
layout: default
---

<h1 class="border border-top-0 border-right-0 border-left-0 mb-3 pb-2">
    {{ page.title }}
</h1>

<div class="d-md-block d-lg-none">
    {% include components/project-meta.html %}
</div>

{{ content }}

<script type="text/javascript">
    $(document).ready(function() {
        $("h2[id]").each(function(idx, h2) {
            var id = $(h2).attr("id")
            var name = $(h2).text().trim()
            var link = $("<a>", {
                "class": "nav-link bg-white mb-1",
                "href": "#" + id,
                "text": name
            })
            $(".header-list").append($("<li>", { "class": "nav-item" }).append(link))
        })
    })
</script>
